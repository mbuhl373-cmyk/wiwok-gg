name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      zip_url:
        required: true
      build_type:
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download zip
        run: wget -O project.zip "${{ inputs.zip_url }}"

      - name: Extract project
        run: |
          mkdir project
          unzip -q project.zip -d project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: project/pubspec.yaml

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 3
